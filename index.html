<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>海洋科学数字实验室 | OSDL</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">

  <style>
    :root {
      --theme-color: #00d4ff;
      --cover-background-color: #000c19;
      --sidebar-background: #041421;
    }

    /* 侧边栏视觉优化 */
    .sidebar {
      border-right: 1px solid rgba(255,255,255,0.05);
      font-size: 15px;
    }

    /* 封面全屏背景网格效果 */
    section.cover {
      background: radial-gradient(circle at center, #02203c 0%, #000c19 100%) !important;
    }
    
    section.cover::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* 物理模拟器在页面内的样式 */
    .sim-controls { display: flex; gap: 15px; margin-top: 15px; justify-content: center; align-items: center; flex-wrap: wrap; }
    .sim-btn { background: #00d4ff; color: #000; border: none; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .sim-btn:hover { background: #fff; box-shadow: 0 0 15px #00d4ff; }
    .sim-btn.stop { background: #ff4d4d; color: #fff; }
    canvas { background: rgba(0,0,0,0.4); border-radius: 12px; cursor: crosshair; border: 1px solid rgba(0, 212, 255, 0.2); }
  </style>
</head>
<body>
  <div id="app">正在初始化深海系统...</div>
  
  <script>
    window.$docsify = {
      name: 'OSDL Lab',
      repo: '',
      loadSidebar: true,    // 开启侧边栏
      coverpage: true,      // 开启封面功能 (需配合 _coverpage.md)
      onlyCover: false,     // 设为 false，允许向下滚动进入文档
      subMaxLevel: 3,       // 自动提取标题到侧边栏
      basePath: './',       // 确保相对路径正确

      // 插件配置：自动跳转到顶部
      auto2top: true,
      
      // 插件配置：警告框样式
      'flexible-alerts': { style: 'flat' }
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    let waveChartInstance = null;
    let animationId = null;
    let time = 0;
    let isRunning = true;

    function initWaveSim() {
      const canvas = document.getElementById('waveChart');
      if (!canvas) return;

      if (waveChartInstance) {
        cancelAnimationFrame(animationId);
        waveChartInstance.destroy();
      }

      const ctx = canvas.getContext('2d');
      waveChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: Array.from({length: 100}, (_, i) => (i / 10).toFixed(1)),
          datasets: [{
            label: '海面高度 (m)',
            data: [],
            borderColor: '#00d4ff',
            backgroundColor: 'rgba(0, 212, 255, 0.15)',
            fill: true,
            pointRadius: 0,
            pointHoverRadius: 6,
            borderWidth: 3,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          animation: false,
          interaction: { mode: 'index', intersect: false },
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, title: { display: true, text: '距离 (m)', color: '#888' } },
            y: { min: -10, max: 10, title: { display: true, text: '振幅', color: '#888' } }
          }
        }
      });

      const toggleBtn = document.getElementById('toggleBtn');
      if (toggleBtn) {
        toggleBtn.onclick = () => {
          isRunning = !isRunning;
          toggleBtn.textContent = isRunning ? '停止模拟' : '开始模拟';
          toggleBtn.classList.toggle('stop', isRunning === false);
          if (isRunning) animate();
        };
      }

      function animate() {
        if (!document.getElementById('waveChart') || !isRunning) return;
        const A = document.getElementById('amp')?.value || 5;
        const T = document.getElementById('period')?.value || 2;
        
        // 降低波速：使用较小的增量
        time += (0.025 / T); 

        waveChartInstance.data.datasets[0].data = waveChartInstance.data.labels.map((x, i) => 
          A * Math.sin(2 * Math.PI * (i/100) - time)
        );
        waveChartInstance.update('none');
        animationId = requestAnimationFrame(animate);
      }
      animate();
    }

    // 监听路由变化，确保切换页面后重新初始化模拟器
    window.addEventListener('hashchange', () => setTimeout(initWaveSim, 500));
    // 首次加载
    document.addEventListener('DOMContentLoaded', () => setTimeout(initWaveSim, 500));
  </script>
</body>
</html>
