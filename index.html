<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>海洋科学数字实验室 | Ocean Science Digital Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Roboto', sans-serif; background: #000c19; color: white; overflow: hidden; }
    /* 背景动画 */
    .bg-container { position: fixed; top: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #02203c 0%, #000c19 100%); z-index: 1; }
    .wave { position: absolute; bottom: 0; width: 200%; height: 100px; background: url('https://s1.ax1x.com/2022/06/08/XfM9m9.png'); background-size: 50% 100px; opacity: 0.1; animation: wave-move 20s linear infinite; }
    @keyframes wave-move { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    
    /* 内容容器 */
    .cover-container { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; z-index: 10; text-align: center; }
    .header h1 { font-size: 3.5em; color: #00d4ff; margin-bottom: 10px; text-shadow: 0 0 20px rgba(0, 212, 255, 0.4); }
    
    /* 响应式网格布局 */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); /* 2x2 布局 */
      gap: 20px; 
      width: 90%; 
      max-width: 900px; 
      margin-top: 40px; 
    }
    
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } } /* 手机端单列 */

    .card { 
      background: rgba(255,255,255,0.05); 
      border: 1px solid rgba(255,255,255,0.1); 
      border-radius: 15px; 
      padding: 25px; 
      transition: all 0.3s ease; 
      text-decoration: none; 
      color: white; 
      display: block;
    }
    .card:hover { 
      transform: translateY(-8px); 
      border-color: #00d4ff; 
      background: rgba(0, 212, 255, 0.08); 
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
    }
    .card h3 { color: #00d4ff; margin-top: 0; font-size: 1.5em; }
    .card p { font-size: 0.9em; opacity: 0.8; line-height: 1.5; }
    
    .footer { position: absolute; bottom: 20px; font-size: 0.8em; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-container"><div class="wave"></div></div>
  <div class="cover-container">
    <div class="header">
      <h1>海洋科学数字实验室</h1>
      <p>Interactive Exploration of Oceanography & Geoscience</p>
    </div>
    
    <div class="grid">
      <a href="docs/#/physics" class="card">
        <h3>🌀 物理海洋</h3>
        <p>探索波浪动力学，实时运行规则波与不规则波交互仿真器。</p>
      </a>
      
      <a href="docs/#/biochem-chem" class="card">
        <h3>🧪 海洋生化</h3>
        <p>解析海洋碳循环泵、化学平衡及海洋生命多样性体系。</p>
      </a>
      
      <a href="docs/#/geology" class="card">
        <h3>🌋 海洋地质</h3>
        <p>直观呈现板块构造演化、海底扩张与海沟俯冲的动态过程。</p>
      </a>
      
      <a href="docs/#/data-resources" class="card" style="border-style: dashed; border-color: rgba(0, 212, 255, 0.5);">
        <h3>📊 数据资源</h3>
        <p>获取全球实时观测数据、海流图及海洋科学常用编程工具。</p>
      </a>
    </div>

    <div class="footer">© 2026 OSDL · Digital Research Platform</div>
  </div>
</body>
</html>
