<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>海洋科学数字实验室 | Ocean Science Digital Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
  
  <style>
    /* 全局样式：建立深海氛围 */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* 防止滚动，保持封面感 */
      font-family: 'Roboto', sans-serif;
      background: radial-gradient(circle at center, #02203c 0%, #000c19 100%);
      color: white;
    }

    /* 封面核心容器 */
    .cover-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      text-align: center;
      position: relative;
    }

    /* 标题与描述 */
    .cover-header {
      margin-bottom: 50px;
      z-index: 10;
    }
    .cover-header h1 {
      font-size: 3.2em;
      margin: 0;
      color: #00d4ff;
      text-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
    }
    .cover-header small {
      display: block;
      font-size: 0.8em;
      opacity: 0.8;
      font-weight: 300;
    }
    .cover-header p {
      font-size: 1.1em;
      max-width: 600px;
      margin: 20px auto;
      font-weight: 300;
      line-height: 1.6;
    }

    /* 卡片网格 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      width: 90%;
      max-width: 1200px;
      z-index: 10;
    }

    /* 交互式卡片样式 */
    .card-link {
      text-decoration: none;
      color: inherit;
    }
    .grid-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 30px;
      transition: all 0.4s ease-in-out;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .grid-card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: #00d4ff;
      background: rgba(0, 212, 255, 0.05);
      box-shadow: 0 15px 40px rgba(0, 212, 255, 0.2);
    }
    .grid-card:hover h3 {
      color: #00d4ff;
    }
    .grid-card .icon {
      font-size: 40px;
      margin-bottom: 20px;
      opacity: 0.9;
    }
    .grid-card h3 {
      margin: 10px 0;
      font-size: 1.5em;
      font-weight: 500;
      transition: color 0.3s;
    }
    .grid-card p {
      font-size: 0.95em;
      opacity: 0.7;
      margin-bottom: 0;
      line-height: 1.5;
    }

    /* 底部导航 */
    .cover-footer {
      position: absolute;
      bottom: 30px;
      z-index: 10;
      font-weight: 300;
      font-size: 0.9em;
    }
    .cover-footer a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      opacity: 0.7;
    }
    .cover-footer a:hover {
      opacity: 1;
      color: #00d4ff;
    }

  </style>
</head>
<body>

  <div class="cover-container">
    
    <div class="cover-header">
      <h1>海洋科学数字实验室</h1>
      <small>Ocean Science Digital Lab</small>
      <p>探索深海的律动，记录科学的发现。集成物理、生化、地质全学科知识体系与实时数据资源。</p>
    </div>

    <div class="grid-container">
      
      <a href="/docs/#/docs/physics" class="card-link">
        <div class="grid-card">
          <div class="icon">🌀</div>
          <h3>物理海洋学</h3>
          <p>波浪理论、海洋动力学、温盐环流及阻尼矩阵模拟分析。</p>
        </div>
      </a>

      <a href="/docs/#/docs/biochem" class="card-link">
        <div class="grid-card">
          <div class="icon">🧪</div>
          <h3>生化与环境</h3>
          <p>全球碳循环、海洋酸化、营养盐分布与生物泵机制研究。</p>
        </div>
      </a>

      <a href="/docs/#/docs/geology" class="card-link">
        <div class="grid-card">
          <div class="icon">🌋</div>
          <h3>地球与构造</h3>
          <p>板块运动、大洋中脊、海底地貌与古海洋气候重建。</p>
        </div>
      </a>

      <a href="/docs/#/docs/data-resources" class="card-link">
        <div class="grid-card">
          <div class="icon">📊</div>
          <h3>数据资源中心</h3>
          <p>集成 NOAA、Argo、Copernicus 等全球权威观测与模型数据门户。</p>
        </div>
      </a>

    </div>

    <div class="cover-footer">
      <span>© 2023 Ocean Science Lab</span>
      <a href="https://github.com/">GitHub Repo</a>
    </div>

  </div>

</body>
</html>
