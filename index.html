<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>海洋科学数字实验室 | Ocean Science Digital Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
  
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      font-family: 'Roboto', sans-serif;
      background: #000c19; /* 深海底色 */
      color: white;
      overflow-x: hidden;
    }

    /* 动态光晕背景 */
    .bg-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, #02203c 0%, #000c19 100%);
      z-index: 1;
    }

    .glow {
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      top: -100px; right: -100px;
      z-index: 2;
      animation: float 10s infinite alternate;
    }

    @keyframes float {
      from { transform: translate(0, 0); }
      to { transform: translate(-50px, 50px); }
    }

    .cover-container {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; z-index: 10; padding: 40px 20px;
      box-sizing: border-box;
    }

    .cover-header { margin-bottom: 60px; }
    .cover-header h1 {
      font-size: clamp(2em, 8vw, 3.5em);
      margin: 0; color: #00d4ff;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    }
    .cover-header small { display: block; font-size: 0.9em; opacity: 0.7; letter-spacing: 2px; margin-top: 10px; }
    .cover-header p {
      font-size: 1.1em; max-width: 700px; margin: 25px auto;
      font-weight: 300; line-height: 1.8; opacity: 0.9;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px; width: 100%; max-width: 1100px;
    }

    .card-link { text-decoration: none; color: inherit; display: block; }
    
    .grid-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px; padding: 35px 25px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
      height: 100%; box-sizing: border-box;
    }

    .grid-card:hover {
      transform: translateY(-12px);
      border-color: #00d4ff;
      background: rgba(0, 212, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .grid-card .icon { font-size: 45px; margin-bottom: 20px; }
    .grid-card h3 { margin: 10px 0; font-size: 1.4em; font-weight: 500; transition: 0.3s; }
    .grid-card:hover h3 { color: #00d4ff; }
    .grid-card p { font-size: 0.95em; opacity: 0.7; line-height: 1.6; margin: 0; }

    .cover-footer { margin-top: 60px; opacity: 0.5; font-size: 0.85em; }
    .cover-footer a { color: white; text-decoration: none; margin: 0 10px; border-bottom: 1px solid transparent; }
    .cover-footer a:hover { border-color: #00d4ff; opacity: 1; }
  </style>
</head>
<body>
  <div class="bg-overlay"></div>
  <div class="glow"></div>

  <div class="cover-container">
    <div class="cover-header">
      <h1>海洋科学数字实验室</h1>
      <small>OCEAN SCIENCE DIGITAL LAB</small>
      <p>探索深海律动，记录科研点滴。这是一个集成的数字化知识库，涵盖物理海洋、生化循环及地质演化研究。</p>
    </div>

    <div class="grid-container">
      <a href="docs/#/physics" class="card-link">
        <div class="grid-card">
          <div class="icon">🌀</div>
          <h3>物理海洋学</h3>
          <p>研究波浪理论、海洋动力学、温盐环流及船舶阻尼矩阵模拟。</p>
        </div>
      </a>

      <a href="docs/#/biochem" class="card-link">
        <div class="grid-card">
          <div class="icon">🧪</div>
          <h3>生化与环境</h3>
          <p>追踪全球碳循环、海洋酸化机制及深海生物地球化学过程。</p>
        </div>
      </a>

      <a href="docs/#/geology" class="card-link">
        <div class="grid-card">
          <div class="icon">🌋</div>
          <h3>地球与构造</h3>
          <p>分析板块运动、大洋中脊演化、海底地貌与深海沉积物。</p>
        </div>
      </a>

      <a href="docs/#/data-resources" class="card-link">
        <div class="grid-card">
          <div class="icon">📊</div>
          <h3>数据资源中心</h3>
          <p>全球权威海洋观测数据门户集成，包括 NOAA、Argo 与卫星遥感资料。</p>
        </div>
      </a>
    </div>

    <div class="cover-footer">
      <span>© 2026 Ocean Lab</span> | 
      <a href="https://github.com/">GitHub</a> | 
      <a href="docs/#/README">文档首页</a>
    </div>
  </div>
</body>
</html>
