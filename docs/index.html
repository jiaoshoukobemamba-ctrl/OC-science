<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>核心实验室 | OSDL</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">

  <style>
    :root {
      --theme-color: #00d4ff;
      --sidebar-background: #041421;
      --content-max-width: 900px;
    }

    /* 侧边栏视觉美化 */
    .sidebar { border-right: 1px solid rgba(255,255,255,0.05); }
    
    /* 物理模拟器组件样式 */
    .sim-container {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 15px;
      border: 1px solid rgba(0, 212, 255, 0.2);
      margin: 20px 0;
    }
    .sim-controls { display: flex; gap: 15px; margin-top: 15px; justify-content: center; align-items: center; flex-wrap: wrap; }
    .sim-btn { 
      background: #00d4ff; color: #000; border: none; padding: 6px 16px; 
      border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s; 
    }
    .sim-btn:hover { background: #fff; box-shadow: 0 0 15px #00d4ff; }
    .sim-btn.stop { background: #ff4d4d; color: #fff; }
    canvas { background: rgba(0,0,0,0.3); border-radius: 10px; cursor: crosshair; }

    /* 丰富网页感的提示框样式 */
    .alert { padding: 15px; border-radius: 8px; margin: 20px 0; border-left: 5px solid #00d4ff; background: rgba(0,212,255,0.05); }
  </style>
</head>
<body>
  <div id="app">正在接入实验室数据...</div>
  
  <script>
    window.$docsify = {
      name: 'OSDL Lab',
      basePath: './',      // 确保读取 docs 目录下的文件
      loadSidebar: true,   // 开启左侧导航
      subMaxLevel: 3,      // 自动提取 md 里的标题
      auto2top: true,      // 切换页面自动回到顶部
      // 这里的封面设为 false，因为封面由根目录 index.html 承担
      coverpage: false, 
      
      // 插件配置：警告框
      'flexible-alerts': { style: 'flat' }
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    let waveChartInstance = null;
    let animationId = null;
    let time = 0;
    let isRunning = true;

    function initWaveSim() {
      const canvas = document.getElementById('waveChart');
      if (!canvas) return;

      if (waveChartInstance) {
        cancelAnimationFrame(animationId);
        waveChartInstance.destroy();
      }

      const ctx = canvas.getContext('2d');
      waveChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: Array.from({length: 100}, (_, i) => (i / 10).toFixed(1)),
          datasets: [{
            label: '高度 (m)',
            data: [],
            borderColor: '#00d4ff',
            backgroundColor: 'rgba(0, 212, 255, 0.1)',
            fill: true,
            pointRadius: 0,
            pointHoverRadius: 6,
            borderWidth: 2,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          animation: false,
          interaction: { mode: 'index', intersect: false },
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false } },
            y: { min: -10, max: 10 }
          }
        }
      });

      const toggleBtn = document.getElementById('toggleBtn');
      if (toggleBtn) {
        toggleBtn.onclick = () => {
          isRunning = !isRunning;
          toggleBtn.textContent = isRunning ? '停止模拟' : '开始模拟';
          toggleBtn.classList.toggle('stop', !isRunning);
          if (isRunning) animate();
        };
      }

      function animate() {
        if (!document.getElementById('waveChart') || !isRunning) return;
        const A = document.getElementById('amp')?.value || 5;
        const T = document.getElementById('period')?.value || 2;
        
        // 降低波速的关键增量
        time += (0.02 / T); 

        waveChartInstance.data.datasets[0].data = waveChartInstance.data.labels.map((x, i) => 
          A * Math.sin(2 * Math.PI * (i/100) - time)
        );
        waveChartInstance.update('none');
        animationId = requestAnimationFrame(animate);
      }
      animate();
    }

    // 处理 Docsify 路由切换时的脚本重新加载
    window.addEventListener('hashchange', () => setTimeout(initWaveSim, 500));
    document.addEventListener('DOMContentLoaded', () => setTimeout(initWaveSim, 500));
  </script>
</body>
</html>
