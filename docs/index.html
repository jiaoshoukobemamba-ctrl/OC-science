<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>交互实验室 | OSDL</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
</head>
<body>
  <div id="app">正在初始化实验室设备...</div>
  <script>
    window.$docsify = {
      name: 'OSDL 交互端',
      basePath: './',
      loadSidebar: true,
      subMaxLevel: 2,
      tabs: { persist: true, sync: true, theme: 'classic', tabBadge: true, tabComments: true }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script>
    // 仿真脚本：监听 URL 变化并初始化波浪模拟器
    function initWaveSim() {
      const ctx = document.getElementById('waveChart');
      if (!ctx) return;
      let t = 0;
      const chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: Array.from({length: 100}, (_, i) => i),
          datasets: [{ label: '实时波浪曲线', data: [], borderColor: '#00d4ff', pointRadius: 0, fill: false }]
        },
        options: { scales: { y: { min: -10, max: 10 }, x: { display: false } }, animation: false }
      });
      function update() {
        const A = document.getElementById('amplitude')?.value || 5;
        const f = document.getElementById('frequency')?.value || 1;
        chart.data.datasets[0].data = chart.data.labels.map(x => A * Math.sin(2 * Math.PI * f * (x/100) + t));
        chart.update(); t += 0.1; requestAnimationFrame(update);
      }
      update();
    }
    // Docsify 渲染后的回调
    window.addEventListener('hashchange', () => setTimeout(initWaveSim, 500));
    window.onload = () => setTimeout(initWaveSim, 500);
  </script>
</body>
</html>
