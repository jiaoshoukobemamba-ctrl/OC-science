<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>海洋科学交互实验室</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css">
  <style>
    :root { --theme-color: #00d4ff; }
    canvas { background: rgba(0,0,0,0.2); border-radius: 10px; margin: 10px 0; }
    .sim-container { padding: 20px; background: rgba(255,255,255,0.05); border-radius: 15px; border: 1px solid #00d4ff33; }
  </style>
</head>
<body>
  <div id="app">载入海洋数据...</div>
  <script>
    window.$docsify = {
      name: 'OSDL Lab',
      basePath: './',
      loadSidebar: true,
      subMaxLevel: 3,
      // 强化 KaTeX 配置
      katex: { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}] }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script>
    // 通用仿真加载器：支持页面内多个模拟器
    function loadSimulations() {
      // 1. 波浪模拟器逻辑
      const waveCtx = document.getElementById('waveChart');
      if (waveCtx) initWave(waveCtx);
      
      // 2. 这里未来可以扩展其他模拟器（如温盐梯度图）
    }

    function initWave(ctx) {
      let t = 0;
      const chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: Array.from({length: 100}, (_, i) => i),
          datasets: [{ label: '海面高度 (m)', data: [], borderColor: '#00d4ff', pointRadius: 0, fill: true, backgroundColor: 'rgba(0, 212, 255, 0.1)' }]
        },
        options: { scales: { y: { min: -10, max: 10 }, x: { display: false } }, animation: false }
      });
      function update() {
        if (!document.getElementById('waveChart')) return;
        const A = document.getElementById('amp')?.value || 5;
        const F = document.getElementById('freq')?.value || 1;
        chart.data.datasets[0].data = chart.data.labels.map(x => A * Math.sin(2 * Math.PI * F * (x/100) + t));
        chart.update(); t += 0.1; requestAnimationFrame(update);
      }
      update();
    }
    window.addEventListener('hashchange', () => setTimeout(loadSimulations, 500));
    window.onload = () => setTimeout(loadSimulations, 500);
  </script>
</body>
</html>
